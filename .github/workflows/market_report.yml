name: 米国市場 朝の市況レポート

on:
  # 毎朝8:00 JST (= 23:00 UTC 前日) に実行
  schedule:
    - cron: "0 23 * * *"
  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-report:
    name: Generate Market Report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Run market report script
        run: python market_report.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_reports/ LATEST_MARKET_REPORT.md
          # 変更がある場合のみコミット
          git diff --cached --quiet || git commit -m "chore: 米国市場レポート $(date +'%Y-%m-%d') [skip ci]"
          git push
