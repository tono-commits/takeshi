name: 米国市場 朝の市況レポート

on:
  schedule:
    # 毎朝 8:00 JST = 23:00 UTC（前日）
    - cron: "0 23 * * *"
  workflow_dispatch: # 手動実行も可能

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance

      - name: Generate market report
        run: python market_report.py /tmp/report.md

      - name: Get today's date (JST)
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +'%Y年%m月%d日')" >> "$GITHUB_OUTPUT"

      - name: Post report as GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const title = `米国市場レポート — ${{ steps.date.outputs.date }}`;

            // Close any existing open report issues from today
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['market-report'],
            });
            for (const issue of existing.data) {
              if (issue.title === title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['market-report'],
            });
