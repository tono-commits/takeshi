name: 🇺🇸 米国市場 朝の市況レポート

on:
  schedule:
    # 毎朝8:00 JST = 23:00 UTC (前日)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  issues: write
  contents: read

jobs:
  market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance --quiet

      - name: Generate market report
        id: report
        run: |
          python scripts/market_report.py > report.md
          echo "Generated report:"
          cat report.md

      - name: Get today's date (JST)
        id: date
        run: |
          TZ='Asia/Tokyo' echo "TODAY=$(date +'%Y年%m月%d日')" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');

            const now = new Date();
            const jst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const dateStr = `${jst.getFullYear()}年${String(jst.getMonth()+1).padStart(2,'0')}月${String(jst.getDate()).padStart(2,'0')}日`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🇺🇸 米国市場 朝の市況レポート - ${dateStr}`,
              body: body,
              labels: ['market-report'],
            });
