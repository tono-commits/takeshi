name: 米国市場 日次レポート

on:
  schedule:
    - cron: '0 23 * * *'  # 毎日 23:00 UTC = 翌8:00 JST
  workflow_dispatch:       # 手動実行も可能

jobs:
  market-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: 市場データ取得・レポート生成
        run: |
          python3 << 'PYEOF'
          import urllib.request
          import json
          import datetime
          import os

          jst = datetime.timezone(datetime.timedelta(hours=9))
          now = datetime.datetime.now(jst)
          date_str = now.strftime('%Y年%m月%d日 (%a)')

          symbols = {
              'S&P 500':  '^GSPC',
              'Dow Jones': '^DJI',
              'NASDAQ':   '^IXIC',
              'Russell 2000': '^RUT',
              'VIX (恐怖指数)': '^VIX',
          }

          fx_symbols = {
              'USD/JPY': 'JPY=X',
              'EUR/USD': 'EURUSD=X',
          }

          rows = []
          errors = []

          def fetch_quote(symbol):
              url = (
                  f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}'
                  f'?interval=1d&range=5d'
              )
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read())

          for name, sym in symbols.items():
              try:
                  data = fetch_quote(sym)
                  meta = data['chart']['result'][0]['meta']
                  price = meta['regularMarketPrice']
                  prev  = meta['chartPreviousClose']
                  chg   = price - prev
                  pct   = chg / prev * 100
                  arrow = '🟢' if chg >= 0 else '🔴'
                  rows.append(
                      f'| {name} | {price:,.2f} | {arrow} {chg:+,.2f} ({pct:+.2f}%) |'
                  )
              except Exception as e:
                  errors.append(f'{name}: {e}')

          fx_rows = []
          for name, sym in fx_symbols.items():
              try:
                  data = fetch_quote(sym)
                  meta = data['chart']['result'][0]['meta']
                  price = meta['regularMarketPrice']
                  prev  = meta['chartPreviousClose']
                  chg   = price - prev
                  pct   = chg / prev * 100
                  arrow = '🟢' if chg >= 0 else '🔴'
                  fx_rows.append(
                      f'| {name} | {price:.4f} | {arrow} {chg:+.4f} ({pct:+.2f}%) |'
                  )
              except Exception as e:
                  errors.append(f'{name}: {e}')

          index_table  = '\n'.join(rows)
          fx_table     = '\n'.join(fx_rows)
          error_section = (
              '\n\n> ⚠️ 取得エラー:\n' + '\n'.join(f'> - {e}' for e in errors)
              if errors else ''
          )

          report = f"""## 🇺🇸 米国株式市場レポート — {date_str}

### 主要指数

| 指数 | 終値 | 前日比 |
|------|-----:|--------|
{index_table}

### 為替

| ペア | レート | 前日比 |
|------|-------:|--------|
{fx_table}

---
*データ: Yahoo Finance | 生成: {now.strftime('%H:%M JST')}*{error_section}
"""

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"REPORT_DATE={now.strftime('%Y-%m-%d')}\n")

          with open('report.md', 'w') as f:
              f.write(report)

          print(report)
          PYEOF

      - name: GitHub Issue として投稿
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const date = process.env.REPORT_DATE;

            // ラベルがなければ作成
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name:  'market-report',
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                name:  'market-report',
                color: '0075ca',
                description: '米国市場日次レポート',
              });
            }

            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `📈 米国市場レポート ${date}`,
              body:   body,
              labels: ['market-report'],
            });
